<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow"><meta name="color-scheme" content="dark">
  <title>{% block title %}TradingAgents · Arkbyte{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script defer src="{{ url_for('static', filename='app.js') }}"></script>
</head>
<body>
<header><a class="brand" href="/" aria-label="TradingAgents home"><span class="mark">at.</span><span>ARKBYTE<span class="brand-sub">TRADING RESEARCH</span></span></a>
{% if signed_in %}<nav aria-label="Main navigation"><a href="/">Research</a><a href="/settings">Settings</a><a href="/password">Security</a><form method="post" action="/logout"><input type="hidden" name="csrf" value="{{ csrf_token }}"><button class="quiet" type="submit">Sign out</button></form></nav>{% else %}<span class="pill">PRIVATE WORKSPACE</span>{% endif %}</header>
<main>{% for message in get_flashed_messages() %}<div class="notice" role="status">{{ message }}</div>{% endfor %}{% block content %}{% endblock %}</main>
<footer><span>TRADINGAGENTS / ARKBYTE TECH</span><span>Research only · No broker connected · No orders placed</span></footer>
</body></html>
