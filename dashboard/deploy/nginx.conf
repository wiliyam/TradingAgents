limit_req_zone $binary_remote_addr zone=tradingagents_login:10m rate=5r/m;
server {
    listen 80;
    server_name at.arkbytetech.com;
    server_tokens off;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://at.arkbytetech.com$request_uri; }
}
server {
    listen 443 ssl;
    server_name at.arkbytetech.com;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/at.arkbytetech.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/at.arkbytetech.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TradingTLS:10m;
    ssl_session_tickets off;
    client_max_body_size 16k;
    client_body_timeout 10s;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    location = /login {
        limit_req zone=tradingagents_login burst=8 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8050;
        proxy_set_header Host at.arkbytetech.com;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location / {
        proxy_pass http://127.0.0.1:8050;
        proxy_set_header Host at.arkbytetech.com;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 50s;
    }
}
